<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 -35 890 890">
  <!-- The site icon: a webcam inside a ring, its cable running out to a USB plug.
       Strokes are thicker than a drawing at this size would need so it still reads at 16 px.
       favicon.ico and apple-touch-icon.png are rendered from this file: node scripts/icons.mjs -->
  <style>
    .ring { stroke: #2370b5 }
    .dark { fill: #1b5a98; stroke: #17508a }
    .cable { stroke: #1b5a98 }
    .cable-light { stroke: #2f80c8 }
    .lens { fill: #174f88 }
    .tip { fill: #eef4fa; stroke: #2370b5 }
    .hole { fill: #1b5a98 }
    .white { fill: #fff }
    .white-line { stroke: #fff }
    @media (prefers-color-scheme: dark) {
      /* Lighter blues so the icon stays visible on a dark tab bar. */
      .ring { stroke: #4b9be2 }
      .dark { fill: #2f7bc4; stroke: #2a6fb2 }
      .cable { stroke: #2f7bc4 }
      .cable-light { stroke: #5aa6ea }
      .lens { fill: #1d5c9c }
    }
  </style>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8ad3"/>
      <stop offset="0.55" stop-color="#2370b5"/>
      <stop offset="0.56" stop-color="#1d63a6"/>
      <stop offset="1" stop-color="#1b5a98"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8ad3"/>
      <stop offset="1" stop-color="#2066a8"/>
    </linearGradient>
    <!-- Where the cable crosses the ring, the ring stops short of it. -->
    <mask id="cable-gap" maskUnits="userSpaceOnUse" x="50" y="-35" width="890" height="890">
      <rect x="50" y="-35" width="890" height="890" fill="#fff"/>
      <path d="M365 500V585C365 615 330 618 280 620C235 622 215 640 215 670C215 705 240 720 285 720H580" fill="none" stroke="#000" stroke-width="84"/>
    </mask>
  </defs>

  <circle class="ring" cx="380" cy="350" r="294" fill="none" stroke-width="54" mask="url(#cable-gap)"/>

  <path class="cable" d="M365 500V585C365 615 330 618 280 620C235 622 215 640 215 670C215 705 240 720 285 720H580" fill="none" stroke-width="42"/>
  <path class="cable-light" d="M365 500V585C365 615 330 618 280 620C235 622 215 640 215 670C215 705 240 720 285 720H580" fill="none" stroke-width="18"/>

  <!-- Stand -->
  <path class="dark" d="M295 440H435Q452 440 462 453L510 508Q524 530 498 530H232Q206 530 220 508L268 453Q278 440 295 440Z" stroke-width="8" stroke-linejoin="round"/>

  <!-- Head and lens -->
  <circle cx="365" cy="312" r="166" fill="url(#head)" stroke="#17508a" stroke-width="8"/>
  <circle cx="365" cy="315" r="112" fill="none" class="white-line" stroke-width="28"/>
  <circle class="lens" cx="365" cy="315" r="98"/>
  <path d="M297 296A72 72 0 0 1 344 246" fill="none" class="white-line" stroke-width="14" stroke-linecap="round"/>
  <path d="M432 340A72 72 0 0 1 398 380" fill="none" class="white-line" stroke-width="12" stroke-linecap="round"/>
  <circle class="white" cx="365" cy="172" r="14"/>

  <!-- USB plug -->
  <rect class="dark" x="566" y="692" width="60" height="58" rx="8" stroke-width="6"/>
  <path d="M584 700V742M598 700V742M612 700V742" fill="none" stroke="#2f80c8" stroke-width="5"/>
  <path d="M624 694L660 652H836V790H660L624 748Z" fill="url(#body)" stroke="#17508a" stroke-width="8" stroke-linejoin="round"/>
  <g class="white-line" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M704 721H784"/>
    <path d="M722 721L738 700H754"/>
    <path d="M734 721L750 742H762"/>
  </g>
  <circle class="white" cx="702" cy="721" r="10"/>
  <circle class="white" cx="760" cy="700" r="8"/>
  <rect class="white" x="760" y="735" width="14" height="14"/>
  <path class="white" d="M800 721L782 710V732Z"/>
  <rect class="tip" x="836" y="668" width="96" height="106" rx="9" stroke-width="10"/>
  <rect class="hole" x="866" y="690" width="28" height="22" rx="3"/>
  <rect class="hole" x="866" y="730" width="28" height="22" rx="3"/>
</svg>
